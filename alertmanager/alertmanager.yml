global:
  resolve_timeout: 5m

route:
  receiver: cafeplanalto-webhook
  group_by: [alertname, severity]
  group_wait: 20s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="critical"
      receiver: cafeplanalto-webhook
      repeat_interval: 30m

receivers:
  - name: cafeplanalto-webhook
    webhook_configs:
      - url: http://172.20.99.24:8080/alerts
        send_resolved: true
