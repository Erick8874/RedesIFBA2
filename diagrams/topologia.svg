  <rect x="1005" y="370" width="115" height="35" class="service"/>
  <text x="1015" y="393" class="small">PostgreSQL · .22</text>

  <rect x="865" y="435" width="275" height="88" class="lan"/>
  <text x="882" y="460" class="subtitle">LAN Gerência · 172.20.99.0/24</text>
