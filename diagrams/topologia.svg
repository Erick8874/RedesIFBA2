  <path d="M265 472 L420 472" class="link"/>

  <rect x="840" y="120" width="325" height="420" class="lan"/>
  <text x="860" y="155" class="subtitle">Matriz</text>
  <rect x="885" y="190" width="230" height="65" class="router"/>
  <text x="915" y="218" class="node">r-matriz · 172.20.10.1</text>
  <text x="915" y="239" class="small">roteamento IPv4 e SNMP</text>

  <rect x="865" y="280" width="275" height="135" class="lan"/>
