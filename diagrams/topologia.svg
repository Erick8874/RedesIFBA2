<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px sans-serif; fill: #0f172a; }
      .node { font: 15px sans-serif; fill: #1e293b; }
      .small { font: 13px sans-serif; fill: #475569; }
      .router { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 12; }
      .lan { fill: #f8fafc; stroke: #64748b; stroke-width: 2; rx: 14; }
      .monitor { fill: #ecfccb; stroke: #65a30d; stroke-width: 1.5; rx: 8; }
      .service { fill: #ffedd5; stroke: #ea580c; stroke-width: 1.5; rx: 8; }
      .client { fill: #f3e8ff; stroke: #9333ea; stroke-width: 1.5; rx: 8; }
      .link { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="660" fill="#ffffff"/>
  <text x="40" y="48" class="title">Café Planalto — topologia do laboratório</text>
  <text x="40" y="76" class="small">Monitoramento da filial segue o plano de dados e atravessa a WAN</text>

