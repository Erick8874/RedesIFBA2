name: clab-cafeplanalto

services:
  r-matriz:
    container_name: clab-cafeplanalto-r-matriz
    image: clab-cafeplanalto-router:latest
    build: ./routers
    environment:
      ROUTER_NAME: r-matriz
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-labpublic}
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
    networks:
      oob:
        ipv4_address: 172.30.0.2
        interface_name: eth0
      wan:
        ipv4_address: 10.0.0.1
        interface_name: eth1
      servicos:
        ipv4_address: 172.20.10.1
        interface_name: eth2
      gerencia:
        ipv4_address: 172.20.99.1
        interface_name: eth3
    restart: unless-stopped

  r-filial:
    container_name: clab-cafeplanalto-r-filial
    image: clab-cafeplanalto-router:latest
    build: ./routers
    environment:
      ROUTER_NAME: r-filial
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-labpublic}
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.rp_filter: "0"
    networks:
      oob:
        ipv4_address: 172.30.0.3
        interface_name: eth0
      wan:
        ipv4_address: 10.0.0.2
        interface_name: eth1
      filial:
        ipv4_address: 172.20.20.1
        interface_name: eth2
    restart: unless-stopped

  dns:
    container_name: clab-cafeplanalto-dns
    build: ./dns
    networks:
      servicos:
        ipv4_address: 172.20.10.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/coredns", "-plugins"]
      interval: 30s
      timeout: 5s
      retries: 3

  route-init-dns:
    image: clab-cafeplanalto-route-init:latest
    build:
      context: .
      dockerfile: Dockerfile.route-init
    network_mode: "service:dns"
    cap_add: [NET_ADMIN]
    command:
      - 172.20.20.0/24
      - 172.20.10.1
      - 172.20.99.0/24
      - 172.20.10.1
      - 10.0.0.0/29
      - 172.20.10.1
    depends_on:
      dns:
        condition: service_started
    restart: "no"

  db:
    container_name: clab-cafeplanalto-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cafeplanalto
      POSTGRES_USER: cafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafeplanalto-local}
    networks:
      servicos:
        ipv4_address: 172.20.10.22
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafe -d cafeplanalto"]
      interval: 5s
      timeout: 3s
      start_period: 240s
      retries: 30
    restart: unless-stopped

  route-init-db:
    image: clab-cafeplanalto-route-init:latest
    build:
      context: .
      dockerfile: Dockerfile.route-init
    network_mode: "service:db"
    cap_add: [NET_ADMIN]
    command:
      - 172.20.20.0/24
      - 172.20.10.1
      - 172.20.99.0/24
      - 172.20.10.1
      - 10.0.0.0/29
      - 172.20.10.1
    depends_on:
      db:
        condition: service_started
    restart: "no"

  api:
    container_name: clab-cafeplanalto-api
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql://cafe:${POSTGRES_PASSWORD:-cafeplanalto-local}@172.20.10.22:5432/cafeplanalto
      ADMIN_TOKEN: ${ADMIN_TOKEN:-somente-laboratorio-local}
      DB_POOL_MAX_SIZE: "10"
    networks:
      servicos:
        ipv4_address: 172.20.10.21
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  route-init-api:
    image: clab-cafeplanalto-route-init:latest
    build:
      context: .
      dockerfile: Dockerfile.route-init
    network_mode: "service:api"
    cap_add: [NET_ADMIN]
    command:
      - 172.20.20.0/24
      - 172.20.10.1
      - 172.20.99.0/24
      - 172.20.10.1
      - 10.0.0.0/29
      - 172.20.10.1
    depends_on:
      api:
        condition: service_started
    restart: "no"

  web:
    container_name: clab-cafeplanalto-web
    image: nginx:1.27-alpine
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      servicos:
        ipv4_address: 172.20.10.20
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  route-init-web:
    image: clab-cafeplanalto-route-init:latest
    build:
      context: .
      dockerfile: Dockerfile.route-init
    network_mode: "service:web"
    cap_add: [NET_ADMIN]
    command:
      - 172.20.20.0/24
      - 172.20.10.1
      - 172.20.99.0/24
      - 172.20.10.1
      - 10.0.0.0/29
      - 172.20.10.1
    depends_on:
      web:
        condition: service_started
    restart: "no"

  cliente-carga:
    container_name: clab-cafeplanalto-cliente-carga
    build:
      context: .
      dockerfile: Dockerfile.load-generator
    environment:
      STORE_URL: http://loja.cafeplanalto.lab
      REQUESTS_PER_SECOND: ${REQUESTS_PER_SECOND:-8}
    dns: [172.20.10.10]
    networks:
      filial:
        ipv4_address: 172.20.20.20
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  route-init-cliente-carga:
    image: clab-cafeplanalto-route-init:latest
    build:
      context: .
      dockerfile: Dockerfile.route-init
    network_mode: "service:cliente-carga"
    cap_add: [NET_ADMIN]
    command:
      - 172.20.10.0/24
      - 172.20.20.1
      - 172.20.99.0/24
      - 172.20.20.1
      - 10.0.0.0/29
      - 172.20.20.1
    depends_on:
      cliente-carga:
        condition: service_started
    restart: "no"

  blackbox:
    container_name: clab-cafeplanalto-sonda
    image: prom/blackbox-exporter:v0.26.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    cap_add: [NET_RAW]
    dns: [172.20.10.10]
    networks:
      filial:
        ipv4_address: 172.20.20.30
    restart: unless-stopped

  route-init-blackbox:
    image: clab-cafeplanalto-route-init:latest
    build:
      context: .
      dockerfile: Dockerfile.route-init
    network_mode: "service:blackbox"
    cap_add: [NET_ADMIN]
    command:
      - 172.20.10.0/24
      - 172.20.20.1
      - 172.20.99.0/24
      - 172.20.20.1
      - 10.0.0.0/29
      - 172.20.20.1
    depends_on:
      blackbox:
        condition: service_started
    restart: "no"

  zabbix-db:
    container_name: clab-cafeplanalto-zabbix-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix-local}
    networks:
      gerencia:
        ipv4_address: 172.20.99.12
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 3s
      start_period: 240s
      retries: 30
    restart: unless-stopped

  zabbix-server:
    container_name: clab-cafeplanalto-zabbix-server
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix-local}
      ZBX_TIMEOUT: 10
      ZBX_STARTPOLLERS: 10
      ZBX_STARTSNMPTRAPPER: 1
      ZBX_SNMPTRAPPERFILE: /var/log/snmptrap/snmptrap.log
    networks:
      gerencia:
        ipv4_address: 172.20.99.10
    extra_hosts:
      - "loja.cafeplanalto.lab:172.20.10.20"
    depends_on:
      zabbix-db:
        condition: service_healthy
    restart: unless-stopped

  route-init-zabbix:
    image: clab-cafeplanalto-route-init:latest
    build:
      context: .
      dockerfile: Dockerfile.route-init
    network_mode: "service:zabbix-server"
    cap_add: [NET_ADMIN]
    command:
      - 172.20.10.0/24
      - 172.20.99.1
      - 172.20.20.0/24
      - 172.20.99.1
      - 10.0.0.0/29
      - 172.20.99.1
    depends_on:
      zabbix-server:
        condition: service_started
    restart: "no"

  zabbix-web:
    container_name: clab-cafeplanalto-zabbix-web
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix-local}
      PHP_TZ: America/Bahia
    networks:
      gerencia:
        ipv4_address: 172.20.99.11
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - zabbix-server
    restart: unless-stopped

  zabbix-agent-dns:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:dns"
    environment:
      ZBX_SERVER_HOST: 172.20.99.10
      ZBX_HOSTNAME: dns
    depends_on:
      dns:
        condition: service_started
      route-init-dns:
        condition: service_completed_successfully
    restart: unless-stopped

  zabbix-agent-web:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:web"
    environment:
      ZBX_SERVER_HOST: 172.20.99.10
      ZBX_HOSTNAME: web
    depends_on:
      web:
        condition: service_started
      route-init-web:
        condition: service_completed_successfully
    restart: unless-stopped

  zabbix-agent-api:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:api"
    environment:
      ZBX_SERVER_HOST: 172.20.99.10
      ZBX_HOSTNAME: api
    depends_on:
      api:
        condition: service_started
      route-init-api:
        condition: service_completed_successfully
    restart: unless-stopped

  zabbix-agent-db:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:db"
    environment:
      ZBX_SERVER_HOST: 172.20.99.10
      ZBX_HOSTNAME: db
    depends_on:
      db:
        condition: service_started
      route-init-db:
        condition: service_completed_successfully
    restart: unless-stopped

  zabbix-agent-load:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:cliente-carga"
    environment:
      ZBX_SERVER_HOST: 172.20.99.10
      ZBX_HOSTNAME: cliente-carga
    depends_on:
      cliente-carga:
        condition: service_started
      route-init-cliente-carga:
        condition: service_completed_successfully
    restart: unless-stopped

  zabbix-agent-blackbox:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    network_mode: "service:blackbox"
    environment:
      ZBX_SERVER_HOST: 172.20.99.10
      ZBX_HOSTNAME: sonda
    depends_on:
      blackbox:
        condition: service_started
      route-init-blackbox:
        condition: service_completed_successfully
    restart: unless-stopped

  zabbix-provision:
    container_name: clab-cafeplanalto-zabbix-provision
    build: ./zabbix/provision
    environment:
      ZABBIX_API_URL: http://172.20.99.11:8080/api_jsonrpc.php
      ZABBIX_USERNAME: ${ZABBIX_USERNAME:-Admin}
      ZABBIX_PASSWORD: ${ZABBIX_ADMIN_PASSWORD:-zabbix}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-labpublic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafeplanalto-local}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    networks:
      gerencia:
        ipv4_address: 172.20.99.30
    depends_on:
      zabbix-web:
        condition: service_started
    restart: "no"

  postgres-exporter:
    container_name: clab-cafeplanalto-postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.15.0
    network_mode: "service:db"
    environment:
      DATA_SOURCE_NAME: postgresql://cafe:${POSTGRES_PASSWORD:-cafeplanalto-local}@172.20.10.22:5432/cafeplanalto?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx-exporter:
    container_name: clab-cafeplanalto-nginx-exporter
    image: nginx/nginx-prometheus-exporter:1.3.0
    network_mode: "service:web"
    command: ["--nginx.scrape-uri=http://127.0.0.1/nginx_status"]
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  node-exporter:
    container_name: clab-cafeplanalto-node-exporter
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      gerencia:
        ipv4_address: 172.20.99.25
    restart: unless-stopped

  cadvisor:
    container_name: clab-cafeplanalto-cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      gerencia:
        ipv4_address: 172.20.99.26
    restart: unless-stopped

  prometheus:
    container_name: clab-cafeplanalto-prometheus
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks:
      gerencia:
        ipv4_address: 172.20.99.20
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  route-init-prometheus:
    image: clab-cafeplanalto-route-init:latest
    build:
      context: .
      dockerfile: Dockerfile.route-init
    network_mode: "service:prometheus"
    cap_add: [NET_ADMIN]
    command:
      - 172.20.10.0/24
      - 172.20.99.1
      - 172.20.20.0/24
      - 172.20.99.1
      - 10.0.0.0/29
      - 172.20.99.1
    depends_on:
      prometheus:
        condition: service_started
    restart: "no"

  alertmanager:
    container_name: clab-cafeplanalto-alertmanager
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      gerencia:
        ipv4_address: 172.20.99.21
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

  grafana:
    container_name: clab-cafeplanalto-grafana
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_MODE: console
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      gerencia:
        ipv4_address: 172.20.99.22
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    container_name: clab-cafeplanalto-loki
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      gerencia:
        ipv4_address: 172.20.99.23
    restart: unless-stopped

  promtail:
    container_name: clab-cafeplanalto-promtail
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./loki/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/run/promtail
    networks:
      gerencia:
        ipv4_address: 172.20.99.27
    depends_on:
      - loki
    restart: unless-stopped

  notifier:
    container_name: clab-cafeplanalto-notifier
    build: ./notifier
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    networks:
      gerencia:
        ipv4_address: 172.20.99.24
    restart: unless-stopped

networks:
  oob:
    name: cafeplanalto-oob
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.254
  wan:
    name: cafeplanalto-wan
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 10.0.0.0/29
          gateway: 10.0.0.6
  servicos:
    name: cafeplanalto-servicos
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.20.10.0/24
          gateway: 172.20.10.254
  gerencia:
    name: cafeplanalto-gerencia
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.20.99.0/24
          gateway: 172.20.99.254
  filial:
    name: cafeplanalto-filial
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
    ipam:
      config:
        - subnet: 172.20.20.0/24
          gateway: 172.20.20.254

volumes:
  postgres-data:
  zabbix-db-data:
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-positions:
